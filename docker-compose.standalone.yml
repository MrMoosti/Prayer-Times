# Plain Docker, no Coolify: publishes the port on the host.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose -f docker-compose.standalone.yml up -d --build
#
# Then open http://localhost:3000.

services:
  mektep-prayer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - prayer-cache:/app/.cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  prayer-cache:
