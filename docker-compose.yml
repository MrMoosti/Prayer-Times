# Mektep Prayer — deploy via Coolify (or plain `docker compose up -d`).
#
# In Coolify: New Resource → Docker Compose, point it at this repository,
# then set DIYANET_API_KEY in the resource's Environment Variables tab.
# Coolify substitutes SERVICE_FQDN_MEKTEP_3000 with the domain it assigns and
# routes its proxy to port 3000, so no host port is published here.

services:
  mektep-prayer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify replaces this with the generated URL and wires up its proxy.
      # Remove it if you are running plain docker compose.
      - SERVICE_FQDN_MEKTEP_3000
      - NODE_ENV=production
      - PORT=3000
      - DIYANET_API_KEY=${DIYANET_API_KEY:-}
      - DIYANET_API_URL=${DIYANET_API_URL:-https://diyanetapi.mennova.nl}
      - OPEN_METEO_BASE_URL=${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
