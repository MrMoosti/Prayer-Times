# Mektep Prayer — deploy via Coolify (or plain `docker compose up -d`).
#
# In Coolify: New Resource → Docker Compose, point it at this repository, then
# set DIYANET_EMAIL and DIYANET_PASSWORD in the resource's Environment
# Variables tab. Coolify substitutes SERVICE_FQDN_MEKTEP_3000 with the domain
# it assigns and routes its proxy to port 3000, so no host port is published
# here.
#
# The named volume is not optional if you use Diyanet: it holds the cached
# months, the auth token and the daily quota counter. Without it every restart
# spends part of an allowance of five requests per endpoint per day.
#
# Run ONE replica. The quota counter is per process, so two instances sharing
# an account would each think they had the full allowance and spend it twice.

services:
  mektep-prayer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify replaces this with the generated URL and wires up its proxy.
      # Remove it if you are running plain docker compose.
      - SERVICE_FQDN_MEKTEP_3000
      - NODE_ENV=production
      - PORT=3000
      # Set these in Coolify's Environment Variables tab, or in a local .env.
      - DIYANET_EMAIL=${DIYANET_EMAIL:-}
      - DIYANET_PASSWORD=${DIYANET_PASSWORD:-}
      - DIYANET_DAILY_BUDGET=${DIYANET_DAILY_BUDGET:-4}
      - DIYANET_BASE_URL=${DIYANET_BASE_URL:-https://awqatsalah.diyanet.gov.tr}
      - ALADHAN_BASE_URL=${ALADHAN_BASE_URL:-https://api.aladhan.com/v1}
      - OPEN_METEO_BASE_URL=${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      - OPEN_METEO_GEOCODING_URL=${OPEN_METEO_GEOCODING_URL:-https://geocoding-api.open-meteo.com/v1}
    expose:
      - '3000'
    volumes:
      - prayer-cache:/app/.cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  prayer-cache:
