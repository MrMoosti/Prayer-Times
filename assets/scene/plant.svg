<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420" width="340" height="420">
  <defs>
    
  <filter id="p-grain" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="4" seed="4" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.32" intercept="-0.080"/>
    </feComponentTransfer>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
  </filter>
    
  <filter id="p-shadow" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#7C6B4C" flood-opacity="0.32"/>
  </filter>
    
  <filter id="p-soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
    <linearGradient id="p-pot" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FDF6E7"/>
      <stop offset="0.55" stop-color="#EFE1C6"/>
      <stop offset="1" stop-color="#CBB48C"/>
    </linearGradient>
    <linearGradient id="p-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFAEE"/>
      <stop offset="1" stop-color="#E2D0AE"/>
    </linearGradient>
  </defs>

  <g filter="url(#p-shadow)">
    <g filter="url(#p-grain)">
      
    <g transform="rotate(-36 170 258)">
      <path d="M 170 258 C 115.4 208.2, 122.16 118.56, 170 92
               C 217.84 118.56, 224.6 208.2, 170 258 Z" fill="#6E9153"/>
      <path d="M 170 248.04 L 170 108.6" stroke="#4E6C39" stroke-width="3.5"
            stroke-linecap="round" opacity="0.55"/>
    </g>
      
    <g transform="rotate(34 170 258)">
      <path d="M 170 258 C 117.5 211.8, 124 128.64000000000001, 170 104
               C 216 128.64000000000001, 222.5 211.8, 170 258 Z" fill="#5F8248"/>
      <path d="M 170 248.76 L 170 119.4" stroke="#436031" stroke-width="3.5"
            stroke-linecap="round" opacity="0.55"/>
    </g>
      
    <g transform="rotate(-70 170 262)">
      <path d="M 170 262 C 121.69999999999999 223.6, 127.68 154.48000000000002, 170 134
               C 212.32 154.48000000000002, 218.3 223.6, 170 262 Z" fill="#7FA162"/>
      <path d="M 170 254.32 L 170 146.8" stroke="#5B7C44" stroke-width="3.5"
            stroke-linecap="round" opacity="0.55"/>
    </g>
      
    <g transform="rotate(68 170 262)">
      <path d="M 170 262 C 123.8 225.4, 129.51999999999998 159.52, 170 140
               C 210.48000000000002 159.52, 216.2 225.4, 170 262 Z" fill="#547A41"/>
      <path d="M 170 254.68 L 170 152.2" stroke="#3C5A2C" stroke-width="3.5"
            stroke-linecap="round" opacity="0.55"/>
    </g>
      
    <g transform="rotate(-4 170 256)">
      <path d="M 170 256 C 119.6 202, 125.84 104.80000000000001, 170 76
               C 214.16 104.80000000000001, 220.4 202, 170 256 Z" fill="#749A57"/>
      <path d="M 170 245.2 L 170 94" stroke="#52743C" stroke-width="3.5"
            stroke-linecap="round" opacity="0.55"/>
    </g>

      <!-- pot -->
      <path d="M 104 286 L 236 286 L 218 388 C 216 402, 206 410, 192 410 L 148 410
               C 134 410, 124 402, 122 388 Z" fill="url(#p-pot)"/>
      <rect x="92" y="264" width="156" height="34" rx="15" fill="url(#p-rim)"/>
    </g>
    <path d="M 128 304 C 122 338, 124 366, 132 394" stroke="#FFFDF5" stroke-opacity="0.55"
          stroke-width="13" stroke-linecap="round" fill="none" filter="url(#p-soft)"/>
    <path d="M 212 306 C 216 338, 214 364, 208 390" stroke="#A98F65" stroke-opacity="0.3"
          stroke-width="12" stroke-linecap="round" fill="none" filter="url(#p-soft)"/>
  </g>
</svg>