  <defs>
    
  <filter id="h-grain-mid" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="4" seed="15" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.34" intercept="-0.085"/>
    </feComponentTransfer>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
  </filter>
    <linearGradient id="h-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDCFA4"/>
      <stop offset="0.4" stop-color="#A2B889"/>
      <stop offset="1" stop-color="#88A06E"/>
    </linearGradient>
    <filter id="h-shadow-mid" x="-10%" y="-60%" width="120%" height="240%">
      <feDropShadow dx="0" dy="-4" stdDeviation="7" flood-color="#65804F" flood-opacity="0.28"/>
    </filter>
  </defs>

