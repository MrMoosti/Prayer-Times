<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780">
  <defs>
    
  <filter id="m-grain" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="3" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.4" intercept="-0.100"/>
    </feComponentTransfer>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
  </filter>
    
  <filter id="m-shadow" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="5" dy="12" stdDeviation="14" flood-color="#96805A" flood-opacity="0.34"/>
  </filter>
    
  <filter id="m-soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
    <linearGradient id="wall" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FDF6E7"/>
      <stop offset="0.5" stop-color="#EFE1C6"/>
      <stop offset="1" stop-color="#CBB48C"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.33" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFBF0"/>
      <stop offset="0.45" stop-color="#EFE1C6"/>
      <stop offset="1" stop-color="#A98F65"/>
    </radialGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E6544"/>
      <stop offset="1" stop-color="#A98C63"/>
    </linearGradient>
    <linearGradient id="gold-body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF0BB"/>
      <stop offset="0.55" stop-color="#F5C842"/>
      <stop offset="1" stop-color="#B47C1B"/>
    </linearGradient>
  </defs>

  <g filter="url(#m-shadow)">
    <g filter="url(#m-grain)">
      <!-- prayer hall -->
      <rect x="150" y="452" width="470" height="298" rx="26" fill="url(#wall)"/>
      <!-- side wings, set back -->
      <rect x="96" y="546" width="76" height="204" rx="22" fill="#E2D0AE"/>
      <rect x="600" y="546" width="82" height="204" rx="22" fill="#E2D0AE"/>

      <!-- drum and main dome -->
      <rect x="276" y="392" width="216" height="72" rx="18" fill="url(#wall)"/>
      <path d="M 216 396
    C 216 275.36, 239.52 205.76000000000002, 333.6 194.16
    C 362.16 175.6, 375.6 168.64, 384 164
    C 392.4 168.64, 405.84 175.6, 434.4 194.16
    C 528.48 205.76000000000002, 552 275.36, 552 396 Z" fill="url(#dome)"/>
      <!-- side dome -->
      <path d="M 126 476
    C 126 430.24, 134.68 403.84000000000003, 169.4 399.44
    C 179.94 392.4, 184.9 389.76, 188 388
    C 191.1 389.76, 196.06 392.4, 206.6 399.44
    C 241.32 403.84000000000003, 250 430.24, 250 476 Z" fill="url(#dome)"/>
      <rect x="140" y="470" width="96" height="26" rx="12" fill="url(#wall)"/>

      <!-- minaret: shaft, balcony, upper shaft, cap -->
      <rect x="750" y="286" width="60" height="464" rx="20" fill="url(#wall)"/>
      <rect x="736" y="372" width="88" height="30" rx="14" fill="#E2D0AE"/>
      <rect x="740" y="366" width="80" height="10" rx="5" fill="#FDF6E7" opacity="0.8"/>
      <rect x="762" y="214" width="36" height="80" rx="14" fill="url(#wall)"/>
      <path d="M 780 92 L 818 220 L 742 220 Z" fill="url(#dome)"/>
    </g>

    <!-- dome highlight and underside shade, kept out of the grain pass -->
    <path d="M 322 232 C 292 288, 280 344, 280 392" stroke="#FFFCF3" stroke-opacity="0.6"
          stroke-width="30" stroke-linecap="round" fill="none" filter="url(#m-soft)"/>
    <path d="M 462 244 C 496 300, 502 350, 502 392 L 452 392 Z"
          fill="#A98F65" opacity="0.22" filter="url(#m-soft)"/>
    <path d="M 168 500 C 158 520, 154 540, 154 552" stroke="#FFFCF3" stroke-opacity="0.5"
          stroke-width="14" stroke-linecap="round" fill="none" filter="url(#m-soft)"/>
    <rect x="758" y="300" width="14" height="420" rx="7" fill="#FFFCF3" opacity="0.4" filter="url(#m-soft)"/>
  </g>

  <!-- recessed openings; the glow layer lights these at night -->
  <g id="windows">
    <path d="M 336 700
    L 336 618.88
    C 336 568.96, 360 544, 384 544
    C 408 544, 432 568.96, 432 618.88
    L 432 700 Z" fill="url(#recess)"/>
    <path d="M 218 700
    L 218 643.84
    C 218 609.28, 235 592, 252 592
    C 269 592, 286 609.28, 286 643.84
    L 286 700 Z" fill="url(#recess)"/>
    <path d="M 482 700
    L 482 643.84
    C 482 609.28, 499 592, 516 592
    C 533 592, 550 609.28, 550 643.84
    L 550 700 Z" fill="url(#recess)"/>
    <path d="M 762 330
    L 762 298.8
    C 762 279.6, 770.5 270, 779 270
    C 787.5 270, 796 279.6, 796 298.8
    L 796 330 Z" fill="url(#recess)"/>
  </g>
  <g fill="none" stroke="#FDF6E7" stroke-opacity="0.55" stroke-width="5">
    <path d="M 336 700
    L 336 618.88
    C 336 568.96, 360 544, 384 544
    C 408 544, 432 568.96, 432 618.88
    L 432 700 Z"/>
    <path d="M 218 700
    L 218 643.84
    C 218 609.28, 235 592, 252 592
    C 269 592, 286 609.28, 286 643.84
    L 286 700 Z"/>
    <path d="M 482 700
    L 482 643.84
    C 482 609.28, 499 592, 516 592
    C 533 592, 550 609.28, 550 643.84
    L 550 700 Z"/>
    <path d="M 762 330
    L 762 298.8
    C 762 279.6, 770.5 270, 779 270
    C 787.5 270, 796 279.6, 796 298.8
    L 796 330 Z"/>
  </g>

  
  <path d="M 384 120
    a 30 30 0 1 0 21.599999999999998 51.6
    a 24 24 0 1 1 -21.599999999999998 -51.6 Z" fill="url(#gold-body)"/>
  
  <path d="M 780 41
    a 21 21 0 1 0 15.12 36.12
    a 16.8 16.8 0 1 1 -15.12 -36.12 Z" fill="url(#gold-body)"/>
</svg>