<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 175" width="336" height="175">
  <defs>
    
  <filter id="c-grain-1" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="1.05" numOctaves="4" seed="3" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a">
      <feFuncA type="linear" slope="0.3" intercept="-0.075"/>
    </feComponentTransfer>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
  </filter>
    
  <filter id="c-shadow-1" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="2" dy="9" stdDeviation="10" flood-color="#93856F" flood-opacity="0.28"/>
  </filter>
    
  <filter id="c-soft-1" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="11"/>
  </filter>
    <linearGradient id="c-body-1" x1="0.25" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FBF6EB"/>
      <stop offset="1" stop-color="#E6DCC8"/>
    </linearGradient>
  </defs>
  <g filter="url(#c-shadow-1)">
    <g filter="url(#c-grain-1)" fill="url(#c-body-1)">
      <circle cx="82" cy="86" r="46"/><circle cx="148" cy="60" r="62"/><circle cx="206" cy="72" r="44"/><circle cx="258" cy="88" r="38"/>
      <rect x="30" y="90" width="266" height="58" rx="29"/>
    </g>
  </g>
  <g fill="#FFFFFF" opacity="0.6" filter="url(#c-soft-1)"><circle cx="70.96000000000001" cy="71.28" r="26.68"/><circle cx="133.12" cy="40.16" r="35.96"/><circle cx="195.44" cy="57.92" r="25.52"/><circle cx="248.88" cy="75.84" r="22.04"/></g>
  <g fill="#CFC3AC" opacity="0.3" filter="url(#c-soft-1)"><circle cx="89.36" cy="101.64" r="23.92"/><circle cx="157.92" cy="81.08" r="32.24"/><circle cx="213.04" cy="86.96000000000001" r="22.880000000000003"/><circle cx="264.08" cy="100.92" r="19.76"/></g>
